name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gridline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_SECRET: ci-app-secret-not-for-production
      BETTER_AUTH_SECRET: ci-app-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:auth
      - run: npm test
      - name: Apply migrations on clean Postgres
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/gridline
        run: npm run test:db
      - name: RLS and domain proofs on Postgres
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          GRIDLINE_TEST_PG: "1"
        run: npm run test:pg

  publish-vps:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        id: gate
        env:
          HOST: ${{ secrets.VPS_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No VPS_HOST / VPS_SSH_KEY — the VPS timer will pull this commit."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to VPS
        if: steps.gate.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: sudo bash /opt/gridline/deploy/vps/update.sh
