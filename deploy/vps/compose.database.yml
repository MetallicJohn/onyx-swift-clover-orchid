# Stage 2/3 — PostgreSQL VPS.
# Default bind is loopback. Set POSTGRES_BIND to the private/VPN address the
# application VPS uses, and firewall 5432 to that source only. Prefer TLS
# (DATABASE_SSL_MODE=require) on the application side.
name: ispsolutions-database

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ispsolutions}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ispsolutions}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ispsolutions} -d ${POSTGRES_DB:-ispsolutions}"]
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - postgres
      - -c
      - listen_addresses=*

volumes:
  pgdata:
