# Stage 1 — single VPS (install.sh default).
# Run from /opt/ispsolutions:
#   docker compose -f deploy/vps/docker-compose.yml --env-file ispsolutions.env up -d
# Split later with compose.application.yml + compose.database.yml + compose.network-services.yml
# (env endpoints only — same application image).
name: ispsolutions

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ispsolutions}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ispsolutions}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ispsolutions} -d ${POSTGRES_DB:-ispsolutions}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    expose:
      - "6379"

  web:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
      args:
        GIT_SHA: ${ISPSOLUTIONS_GIT_SHA:-unknown}
    restart: unless-stopped
    env_file:
      - ../../ispsolutions.env
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      NODE_ENV: production
      ROLE: web
      GENIEACS_NBI_URL: ${GENIEACS_NBI_URL:-http://genieacs:7557}
      GENIEACS_CWMP_URL: ${GENIEACS_CWMP_URL:-http://genieacs:7547}
      ISPSOLUTIONS_INTERNAL_URL: ${ISPSOLUTIONS_INTERNAL_URL:-http://web:3000}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongo:27017/genieacs}
      RADIUS_HOST: ${RADIUS_HOST:-freeradius}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-${ACS_EDGE_TOKEN}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    ports:
      # Loopback only — cwmp-edge uses host networking and cannot resolve `web`.
      - "127.0.0.1:3000:3000"

  worker:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
      args:
        GIT_SHA: ${ISPSOLUTIONS_GIT_SHA:-unknown}
    restart: unless-stopped
    env_file:
      - ../../ispsolutions.env
    environment:
      NODE_ENV: production
      ROLE: worker
      SKIP_MIGRATE: "1"
      ISPSOLUTIONS_INTERNAL_URL: ${ISPSOLUTIONS_INTERNAL_URL:-http://web:3000}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-${ACS_EDGE_TOKEN}}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    depends_on:
      web:
        condition: service_healthy

  collector:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
      args:
        GIT_SHA: ${ISPSOLUTIONS_GIT_SHA:-unknown}
    restart: unless-stopped
    env_file:
      - ../../ispsolutions.env
    environment:
      NODE_ENV: production
      ROLE: collector
      SKIP_MIGRATE: "1"
      ISPSOLUTIONS_INTERNAL_URL: ${ISPSOLUTIONS_INTERNAL_URL:-http://web:3000}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-${ACS_EDGE_TOKEN}}
      TRAFFIC_COLLECTION_INTERVAL: ${TRAFFIC_COLLECTION_INTERVAL:-30}
      TRAFFIC_ROUTER_INTERVAL: ${TRAFFIC_ROUTER_INTERVAL:-60}
      COLLECTOR_ID: ${COLLECTOR_ID:-default}
    depends_on:
      web:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  genieacs:
    image: drumsergio/genieacs:1.2.16.0
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      genieacs-init:
        condition: service_completed_successfully
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: ${GENIEACS_MONGODB_CONNECTION_URL:-mongodb://mongo/genieacs}
      GENIEACS_UI_JWT_SECRET: ${GENIEACS_UI_JWT_SECRET}
      GENIEACS_EXT_DIR: /opt/genieacs/ext
      GENIEACS_EXT_TIMEOUT: "8000"
      # One worker each. Default 0 = one per CPU and the image then SIGABRTs
      # a pile of child processes (NBI never binds 7557).
      GENIEACS_CWMP_WORKER_PROCESSES: "1"
      GENIEACS_NBI_WORKER_PROCESSES: "1"
      GENIEACS_FS_WORKER_PROCESSES: "1"
      GENIEACS_UI_WORKER_PROCESSES: "1"
      ISPSOLUTIONS_INTERNAL_URL: ${ISPSOLUTIONS_INTERNAL_URL:-http://web:3000}
      ACS_EDGE_TOKEN: ${ACS_EDGE_TOKEN}
    volumes:
      - ./genieacs/ext:/opt/genieacs/ext:ro
      - ./genieacs/ext:/opt/genieacs/config/ext:ro
    ports:
      # Loopback only — cwmp-edge (host network) forwards here. NBI stays unpublished.
      - "127.0.0.1:7547:7547"
    expose:
      - "7547"
      - "7557"
      - "7567"
      - "3000"

  genieacs-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./genieacs/init-config.js:/init-config.js:ro
    command: ["mongosh", "${GENIEACS_MONGODB_CONNECTION_URL:-mongodb://mongo/genieacs}", "/init-config.js"]
    restart: "no"

  cwmp-edge:
    image: node:22-alpine
    restart: unless-stopped
    # Bind 7551–7999 on the VPS. Mapping that range through docker-proxy
    # starts ~450 userland proxies and fails ("failed to start docker-proxy").
    network_mode: host
    working_dir: /edge
    command: ["node", "cwmp-edge.mjs"]
    environment:
      GENIEACS_CWMP_URL: ${ACS_EDGE_CWMP_URL:-http://127.0.0.1:7547}
      ISPSOLUTIONS_INTERNAL_URL: ${ACS_EDGE_INTERNAL_URL:-http://127.0.0.1:3000}
      ACS_EDGE_TOKEN: ${ACS_EDGE_TOKEN}
      ACS_TLS_CERT: ${ACS_TLS_CERT:-}
      ACS_TLS_KEY: ${ACS_TLS_KEY:-}
      ACS_TLS_CERT_FILE: ${ACS_TLS_CERT_FILE:-}
      ACS_TLS_KEY_FILE: ${ACS_TLS_KEY_FILE:-}
    volumes:
      - ./cwmp-edge.mjs:/edge/cwmp-edge.mjs:ro
    depends_on:
      - genieacs
      - web

  freeradius:
    build:
      context: ../..
      dockerfile: deploy/vps/freeradius/Dockerfile
    restart: unless-stopped
    environment:
      ISPSOLUTIONS_URL: ${ISPSOLUTIONS_URL:-http://web:3000}
      ISPSOLUTIONS_SLUG: ${ISPSOLUTIONS_SLUG:-}
      RADIUS_API_KEY: ${RADIUS_API_KEY:-}
    depends_on:
      - web
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ISPSOLUTIONS_DOMAIN: ${ISPSOLUTIONS_DOMAIN:-${GRIDLINE_DOMAIN}}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  mongodata:
  redisdata:
  caddy_data:
  caddy_config:
