# Run from /opt/gridline (install.sh sets this up):
#   docker compose -f deploy/vps/docker-compose.yml --env-file gridline.env up -d
name: gridline

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gridline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gridline}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gridline} -d ${POSTGRES_DB:-gridline}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../gridline.env
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      NODE_ENV: production
      GENIEACS_NBI_URL: ${GENIEACS_NBI_URL:-http://genieacs:7557}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  genieacs:
    image: drumsergio/genieacs:1.2.16.0
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://mongo/genieacs
      GENIEACS_UI_JWT_SECRET: ${GENIEACS_UI_JWT_SECRET}
    ports:
      - "7547:7547"
      - "7567:7567"
    expose:
      - "7557"
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      GRIDLINE_DOMAIN: ${GRIDLINE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  mongodata:
  caddy_data:
  caddy_config:
