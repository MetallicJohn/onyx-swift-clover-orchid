<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Outfit;
        src: url("./Outfit-Variable.ttf") format("truetype");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0a0e13;
      }
      .frame {
        position: relative;
        width: 1200px;
        height: 630px;
        background: #0a0e13 url("./bg.jpg") center / cover no-repeat;
      }
      .scrim {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 58% 52% at 50% 48%, rgba(10, 14, 19, 0.22) 0%, rgba(10, 14, 19, 0.55) 100%),
          linear-gradient(180deg, rgba(10, 14, 19, 0.18) 0%, rgba(10, 14, 19, 0.08) 40%, rgba(10, 14, 19, 0.08) 60%, rgba(10, 14, 19, 0.28) 100%);
      }
      .lockup {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: Outfit, ui-sans-serif, sans-serif;
        padding: 72px 160px;
      }
      .mark {
        width: 44px;
        height: 44px;
        margin-bottom: 28px;
        filter: drop-shadow(0 0 12px rgba(74, 168, 160, 0.45));
      }
      h1 {
        margin: 0;
        color: #e8eef4;
        font-weight: 650;
        font-size: 96px;
        letter-spacing: 0.03em;
        line-height: 1;
        text-shadow: 0 2px 24px rgba(10, 14, 19, 0.65);
        white-space: nowrap;
      }
      .rule {
        width: 88px;
        height: 2px;
        background: #4aa8a0;
        margin: 28px 0 22px;
        border-radius: 1px;
        box-shadow: 0 0 16px rgba(74, 168, 160, 0.55);
      }
      p {
        margin: 0;
        color: #4aa8a0;
        font-weight: 400;
        font-size: 28px;
        letter-spacing: 0.07em;
        text-shadow: 0 2px 16px rgba(10, 14, 19, 0.7);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="scrim"></div>
      <div class="lockup">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="8" r="3.2" fill="#4AA8A0" />
          <circle cx="8" cy="24" r="3.2" fill="#4AA8A0" />
          <circle cx="24" cy="24" r="3.2" fill="#4AA8A0" />
          <path
            d="M16 8 L8 24 M16 8 L24 24"
            fill="none"
            stroke="#4AA8A0"
            stroke-width="2.4"
            stroke-linecap="round"
          />
        </svg>
        <h1>ISP Solutions</h1>
        <div class="rule"></div>
        <p>Run your ISP from one platform</p>
      </div>
    </div>
  </body>
</html>
