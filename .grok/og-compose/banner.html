<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Outfit;
        src: url("./Outfit-Variable.ttf") format("truetype");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 264px;
        overflow: hidden;
        background: #0a0e13;
      }
      .frame {
        position: relative;
        width: 1200px;
        height: 264px;
        background: #0a0e13 url("./banner-bg.jpg") center / cover no-repeat;
      }
      .scrim {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(10, 14, 19, 0.72) 0%, rgba(10, 14, 19, 0.46) 38%, rgba(10, 14, 19, 0.08) 62%, rgba(10, 14, 19, 0.18) 100%),
          linear-gradient(180deg, rgba(10, 14, 19, 0.12) 0%, rgba(10, 14, 19, 0) 40%, rgba(10, 14, 19, 0.35) 100%);
      }
      .lockup {
        position: absolute;
        top: 36px;
        left: 48px;
        right: 620px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        font-family: Outfit, ui-sans-serif, sans-serif;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .mark {
        width: 28px;
        height: 28px;
        flex: none;
        filter: drop-shadow(0 0 10px rgba(74, 168, 160, 0.5));
      }
      h1 {
        margin: 0;
        color: #e8eef4;
        font-weight: 650;
        font-size: 42px;
        letter-spacing: 0.03em;
        line-height: 1;
        text-shadow: 0 2px 18px rgba(10, 14, 19, 0.75);
        white-space: nowrap;
      }
      .rule {
        width: 56px;
        height: 2px;
        background: #4aa8a0;
        margin: 14px 0 10px;
        border-radius: 1px;
        box-shadow: 0 0 12px rgba(74, 168, 160, 0.55);
      }
      p {
        margin: 0;
        color: #4aa8a0;
        font-weight: 400;
        font-size: 16px;
        letter-spacing: 0.08em;
        text-shadow: 0 2px 12px rgba(10, 14, 19, 0.75);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="scrim"></div>
      <div class="lockup">
        <div class="row">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="8" r="3.2" fill="#4AA8A0" />
            <circle cx="8" cy="24" r="3.2" fill="#4AA8A0" />
            <circle cx="24" cy="24" r="3.2" fill="#4AA8A0" />
            <path
              d="M16 8 L8 24 M16 8 L24 24"
              fill="none"
              stroke="#4AA8A0"
              stroke-width="2.4"
              stroke-linecap="round"
            />
          </svg>
          <h1>ISP Solutions</h1>
        </div>
        <div class="rule"></div>
        <p>Run your ISP from one platform</p>
      </div>
    </div>
  </body>
</html>
